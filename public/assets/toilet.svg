<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/><stop offset=".55" stop-color="#efe7db"/><stop offset="1" stop-color="#d9ccba"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6e0"/><stop offset="1" stop-color="#79b8b0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe1a0"/><stop offset="1" stop-color="#d7a441"/>
    </linearGradient>
  </defs>
  <!-- tank -->
  <rect x="16" y="10" width="56" height="42" rx="9" fill="url(#porcelain)" stroke="#c9b9a4" stroke-width="2"/>
  <rect x="13" y="7" width="62" height="10" rx="5" fill="#fdfaf5" stroke="#c9b9a4" stroke-width="2"/>
  <rect x="56" y="20" width="10" height="7" rx="3.5" fill="url(#gold)"/>
  <!-- seat hinge -->
  <rect x="46" y="50" width="18" height="10" rx="4" fill="#e6dccf" stroke="#c9b9a4" stroke-width="1.6"/>
  <!-- bowl -->
  <path d="M30 58 h60 a6 6 0 0 1 6 6 c0 20 -14 30 -22 34 l2 10 a6 6 0 0 1 -6 7 h-20 a6 6 0 0 1 -6 -7 l2 -10 c-8 -4 -22 -14 -22 -34 a6 6 0 0 1 6 -6 z" fill="url(#porcelain)" stroke="#c9b9a4" stroke-width="2"/>
  <!-- rim -->
  <ellipse cx="60" cy="63" rx="34" ry="10" fill="#fdfaf5" stroke="#c9b9a4" stroke-width="2"/>
  <!-- water -->
  <ellipse cx="60" cy="64" rx="26" ry="6.5" fill="url(#water)"/>
  <ellipse cx="52" cy="63" rx="7" ry="1.8" fill="#e3f5f1" opacity=".8"/>
</svg>
